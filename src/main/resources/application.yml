server:
  port: 8080

spring:
  application:
    name: delta-home-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/deltahomes}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:00}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      # DEV only: Hibernate creates/updates the schema. Switch to 'validate' once
      # Flyway migrations under db/migration are in place (see flyway below).
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
    show-sql: false
    open-in-view: false

  flyway:
    # Disabled until migration scripts are written. Re-enable together with ddl-auto: validate.
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:noreply@deltahomes.app}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

# Meilisearch
meilisearch:
  host: ${MEILISEARCH_HOST:http://localhost:7700}
  api-key: ${MEILISEARCH_API_KEY:}

# Twilio (SMS OTP)
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  phone-number: ${TWILIO_PHONE_NUMBER:}

# Firebase (push notifications)
firebase:
  config-path: ${FIREBASE_CONFIG_PATH:classpath:firebase-service-account.json}

# Object storage (S3-compatible)
storage:
  endpoint: ${STORAGE_ENDPOINT:}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
  bucket: ${STORAGE_BUCKET:deltahomes-media}
  region: ${STORAGE_REGION:auto}

# JWT
jwt:
  secret: ${JWT_SECRET:dHlwZS5hY2Nlc3MtdG9rZW4uZXhhbXBsZS5jb20uZGVsdGFob21lcy5iYWNrZW5k}
  expiration-ms: 86400000          # access token: 24h
  refresh-expiration-ms: 604800000 # refresh token: 7 days

# App
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cors:
    # NOTE: wildcard (*) cannot be combined with credentials in CORS — keep an explicit origin.
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  otp:
    expiry-minutes: 5
    max-attempts: 5
    max-sends-per-window: 5        # per phone + purpose per 15 min
    resend-cooldown-seconds: 60
  admin:
    # Permanent bootstrap admin account. The account is auto-created on startup
    # and `permanent-otp` is always accepted for this phone, for any purpose.
    phone: ${ADMIN_PHONE:01026962089}
    name: ${ADMIN_NAME:Delta Admin}
    password: ${ADMIN_PASSWORD:admin123}
    permanent-otp: ${ADMIN_PERMANENT_OTP:112231}

logging:
  level:
    com.deltahomes: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
