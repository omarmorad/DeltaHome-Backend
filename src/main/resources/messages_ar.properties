# Delta Homes — Arabic messages (العربية)
# Keys match the English literals thrown in the service layer.

# ---------- Auth / OTP ----------
Email already registered=البريد الإلكتروني مسجل بالفعل
Phone number already registered=رقم الهاتف مسجل بالفعل
Admin accounts are provisioned by the platform=حسابات المشرفين يتم إنشاؤها من قبل المنصة
Invalid credentials=بيانات الدخول غير صحيحة
Invalid or expired refresh token=رمز التحديث غير صالح أو منتهي الصلاحية
User not found=المستخدم غير موجود
No account found for this email=لا يوجد حساب بهذا البريد الإلكتروني
No account found for this email. Please register first.=لا يوجد حساب بهذا البريد الإلكتروني. الرجاء التسجيل أولاً.
No account found for this phone=لا يوجد حساب بهذا الرقم
No account found for this phone. Please register first.=لا يوجد حساب بهذا الرقم. الرجاء التسجيل أولاً.
Email or phone is required=البريد الإلكتروني أو رقم الهاتف مطلوب
Invalid OTP code.=رمز التحقق غير صحيح.
OTP code has expired. Request a new one.=انتهت صلاحية رمز التحقق. الرجاء طلب رمز جديد.
Too many OTP requests. Please try again later.=تم تجاوز الحد المسموح من الطلبات. حاول مرة أخرى لاحقاً.
Please wait a moment before requesting a new code.=الرجاء الانتظار قليلاً قبل طلب رمز جديد.
Too many invalid attempts. Request a new code.=تم تجاوز عدد المحاولات المسموح. الرجاء طلب رمز جديد.
Failed to send email. Please try again.=فشل إرسال البريد الإلكتروني. حاول مرة أخرى.
Failed to send SMS. Please try again.=فشل إرسال الرسالة النصية. حاول مرة أخرى.
Current password is incorrect=كلمة المرور الحالية غير صحيحة

# ---------- Properties ----------
Property not found=العقار غير موجود
Archived properties cannot be updated=لا يمكن تعديل العقار المؤرشف

# ---------- Companies / social ----------
Company not found=الشركة غير موجودة
Provider not found=مقدم الخدمة غير موجود
Already following this company=أنت تتابع هذه الشركة بالفعل
Not following this company=أنت لا تتابع هذه الشركة
Item already saved=العنصر محفوظ بالفعل
You can only remove your own saved items=يمكنك حذف العناصر المحفوظة الخاصة بك فقط
You have already reviewed this entity=لقد قمت بتقييم هذا العنصر بالفعل
Rating must be between 1 and 5=التقييم يجب أن يكون بين 1 و 5
Cannot review without a verified interaction=لا يمكن التقييم بدون تفاعل موثق
entityType is required=نوع الكيان مطلوب
entityType and entityId are required=نوع الكيان ومعرفه مطلوبان
Unsupported entity type=نوع كيان غير مدعوم

# ---------- Chat ----------
participantIds is required=معرف المشاركين مطلوب
Conversations are currently 1:1 - provide exactly one participant=المحادثات تدعم مشاركاً واحداً فقط
Cannot start a conversation with yourself=لا يمكنك بدء محادثة مع نفسك
Message must have content or media=الرسالة يجب أن تحتوي على نص أو وسائط
You are not a participant in this conversation=أنت لست مشاركاً في هذه المحادثة

# ---------- Appointments ----------
requestedSlot must be in the future=موعد الزيارة يجب أن يكون في المستقبل
You are not allowed to update this appointment=لا يمكنك تعديل هذا الموعد

# ---------- Admin ----------
A rejection reason is required=سبب الرفض مطلوب
decision must be APPROVE or REJECT=القرار يجب أن يكون موافقة أو رفض
This verification has already been decided=تم البت في طلب التوثيق مسبقاً

# ---------- Validation ----------
Validation failed=فشل التحقق من البيانات

# ---------- Security ----------
Authentication is required to access this resource=المصادقة مطلوبة للوصول إلى هذا المورد
You do not have permission to perform this action=ليس لديك صلاحية لتنفيذ هذا الإجراء
